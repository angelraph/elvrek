<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07080a;font-family:Inter,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:radial-gradient(1000px 700px at 75% 50%,rgba(225,29,46,.14),transparent 70%)}
.browser{position:absolute;left:64px;top:200px;width:1180px;height:720px;border-radius:14px;overflow:hidden;
  background:#0b0d11;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.browser .bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;background:#14171c}
.browser .bar i{width:12px;height:12px;border-radius:50%;background:#2b2f36}
.browser .bar span{margin-left:16px;padding:7px 18px;border-radius:8px;background:#0b0d11;color:#9aa2ad;font:500 15px/1 Inter;width:520px}
.browser .vp{position:absolute;top:44px;left:0;width:1440px;height:822px;transform:scale(.8194);transform-origin:0 0}
.phone{position:absolute;left:1350px;top:150px;width:410px;height:840px;border-radius:56px;background:#0d0f13;
  border:2px solid rgba(255,255,255,.18);box-shadow:0 40px 90px rgba(0,0,0,.7),inset 0 0 0 9px #050608;overflow:hidden}
.phone .vp{position:absolute;left:12px;top:54px;width:390px;height:796px;transform:scale(.9744);transform-origin:0 0;border-radius:0 0 44px 44px;overflow:hidden}
.phone .notch{position:absolute;left:50%;top:18px;width:104px;height:26px;margin-left:-52px;border-radius:20px;background:#000;z-index:3}
iframe{border:0;width:100%;height:100%;display:block;background:#07080a}
.cap{position:absolute;left:1350px;top:1000px;width:410px;text-align:center;font:700 18px/1 'Barlow Condensed';letter-spacing:.24em;color:#8b93a0}
</style></head>
<body><div class="bg"></div>
<div class="browser"><div class="bar"><i></i><i></i><i></i><span>elvrek.vercel.app/faq</span></div>
  <div class="vp"><iframe src="https://elvrek.vercel.app/faq"></iframe></div></div>
<div class="phone"><div class="notch"></div><div class="vp"><iframe src="https://elvrek.vercel.app/"></iframe></div></div>
<div class="cap">ON A PHONE</div>
</body></html>
