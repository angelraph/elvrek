<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#07080a;font-family:Inter,sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(900px 600px at 78% 30%,rgba(225,29,46,.13),transparent 70%),radial-gradient(800px 700px at 10% 90%,rgba(60,90,160,.10),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:64px 64px}
.badge{position:absolute;right:64px;top:118px;display:flex;gap:12px}
.pill{font:600 15px/1 Inter;letter-spacing:.04em;padding:11px 16px;border-radius:999px;border:1px solid rgba(225,29,46,.6);background:rgba(255,255,255,.04);color:#fff}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e11d2e;margin-right:9px;box-shadow:0 0 10px #e11d2e}
.pill.speed{color:#ffd166;border-color:rgba(255,209,102,.45);display:none}
.frame{position:absolute;left:260px;top:196px;width:1400px;height:840px;border-radius:6px;border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000}
.cap{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:500 18px/1 Inter;color:#6f7884}
</style></head><body><div class="bg"></div><div class="grid"></div>
<div class="badge"><span class="pill"><i></i>Recorded on QNX 8.0, redrawn by the console's own code</span><span class="pill speed" id="sp">Sped up 3x while charging</span></div>
<div class="frame"></div><div class="cap">elv-console on QNX Screen. It only reads /dev/elvrek/status.</div></body></html>
