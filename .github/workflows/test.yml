name: tests

on:
  push:
  pull_request:

jobs:
  host:
    name: Host safety scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safety scenarios (the same core code that runs on QNX)
        run: make test
      - name: Portable target processes build
        run: make host-procs
      - name: Smoke test of the portable processes
        run: sh tests/host/smoke_procs.sh
      - name: Crew console drawing and replay build, six previews
        run: make console
      - name: Requirements trace (every link checked, matrix must be current)
        run: make trace && git diff --exit-code REQUIREMENTS.md
